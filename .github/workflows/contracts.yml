name: contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run --locked --extra dev python -m ruff check .
      - run: uv run --locked --extra dev python -m mypy
      - run: uv run --locked --extra dev python scripts/check.py
      - run: uv run --locked --extra dev python scripts/export_schemas.py
      - run: git diff --exit-code -- schemas
